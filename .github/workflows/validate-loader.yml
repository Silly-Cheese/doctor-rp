name: Validate Northstar Loader
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.head_commit.message == 'Harden and accelerate Northstar startup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate startup modules
        run: |
          node --check clinical-bridge.js
          node --check northstar-enterprise.js
          node --check northstar-clinical-plus.js
          node --check operations.js
