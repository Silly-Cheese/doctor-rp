name: Validate Procedure Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: contains(github.event.head_commit.message, 'Validate procedure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check northstar-enterprise.js
          node --check case-records.js
      - name: Check procedure workflow markers
        run: |
          grep -q "openProcedureTimeout" northstar-enterprise.js
          grep -q "openProcedureCompletion" northstar-enterprise.js
          grep -q "procedure-completed" northstar-enterprise.js
          grep -q "renderCaseProcedures" case-records.js
