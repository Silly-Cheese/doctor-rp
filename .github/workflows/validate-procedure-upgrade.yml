name: Validate Procedure Upgrade
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    if: github.event.head_commit.message == 'Upgrade procedure workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: node --check northstar-enterprise.js
      - name: Check procedure workflow markers
        run: |
          grep -q "openProcedureTimeout" northstar-enterprise.js
          grep -q "openProcedureCompletion" northstar-enterprise.js
          grep -q "procedure-completed" northstar-enterprise.js
