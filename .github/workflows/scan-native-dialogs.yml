name: Scan Native Browser Dialogs
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    if: github.event.head_commit.message == 'Scan native browser dialogs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find native dialogs
        run: |
          echo '=== Native dialog usages ==='
          grep -RInE '\b(window\.)?(alert|confirm|prompt)\s*\(' --include='*.js' . || true
