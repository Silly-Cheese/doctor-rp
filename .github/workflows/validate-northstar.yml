name: Validate Northstar application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Verify index assets exist
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          for(const match of html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))(?:\?[^"]*)?"/g)){
            const local=match[1];
            if(local.startsWith('http:')||local.startsWith('https:'))continue;
            if(!fs.existsSync(local)){console.error('Missing file:',local);process.exitCode=1}
          }
          NODE
      - name: Audit Firestore collections and dynamically loaded files
        run: node tests/audit-collections.cjs
      - name: Verify new server functions dependencies
        run: |
          cd functions
          npm install --package-lock-only --ignore-scripts
          node --check index.js
      - name: Load Cloud Functions entrypoint and check callable exports
        run: |
          npm --prefix functions install --ignore-scripts
          GOOGLE_CLOUD_PROJECT=demo-northstar node -e "const f=require('./functions/index.js'); for (const k of ['requestPatientDeletion','approvePatientDeletion','scanOrphanPatientRecords','requestOrphanCleanup','northstarHealth']) { if (typeof f[k]!=='function') throw Error('Missing function: '+k); } console.log('Cloud Functions entrypoint loaded successfully');"

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runner
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/northstar-http.log 2>&1 &
          sleep 2
      - name: Verify browser modules initialize
        run: node tests/smoke-browser.cjs

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator and rules testing SDK
        run: npm install --no-save firebase-tools@14 @firebase/rules-unit-testing@5 firebase@12
      - name: Run Firestore security rules regression tests
        run: npx firebase emulators:exec --only firestore --project demo-northstar "node tests/firestore-rules.cjs"
