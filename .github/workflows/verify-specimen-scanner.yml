name: Verify Specimen Scanner Integration
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify specimen scanner integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check northstar-specimen-verification.js
          node --check clinical-bridge.js
