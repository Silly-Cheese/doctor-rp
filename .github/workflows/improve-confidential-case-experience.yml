name: Improve Northstar Confidential Case Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  improve:
    if: github.event.head_commit.message == 'Run confidential case upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply upgrade
        run: python scripts/improve_case_security.py
      - name: Verify JavaScript
        run: node --check case-records.js
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add case-records.js case-records.css firestore.rules
          git commit -m "Upgrade confidential case security and audit experience"
          git push origin main
