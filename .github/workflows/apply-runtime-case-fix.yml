name: Apply Northstar Runtime and Case Security Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Northstar runtime and case security fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply targeted fixes
        run: python scripts/fix_breakglass_and_case_confidentiality.py
      - name: Verify JavaScript syntax
        run: |
          node --check northstar-dialogs.js
          node --check northstar-breakglass.js
          node --check northstar-med-verification.js
          node --check northstar-highrisk-med.js
          node --check case-records.js
      - name: Verify historical confidentiality rule
        run: |
          grep -q 'canManageEncounterConfidentiality' firestore.rules
          ! grep -A4 'validProviderConfidentialUpdate' firestore.rules | grep -q "resource.data.status != 'discharged'"
      - name: Commit fixes
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add case-records.js firestore.rules northstar-breakglass.js
          git commit -m "Fix emergency access and historical case confidentiality"
          git push origin main
