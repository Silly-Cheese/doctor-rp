name: Northstar Account Provisioning Repair Retry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Retry Northstar account provisioning repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair provisioning flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          p = Path('app.js')
          app = p.read_text()

          if 'let accountProvisioning = false;' not in app:
              app = app.replace('let toastTimer;\n', 'let toastTimer;\nlet accountProvisioning = false;\n', 1)

          new_register = '''async function registerStaff(event) {
            event.preventDefault();
            setAuthMessage();

            const firstName = normalizeName(document.querySelector("#firstName").value);
            const lastName = normalizeName(document.querySelector("#lastName").value);
            const email = document.querySelector("#registerEmail").value.trim().toLowerCase();
            const password = document.querySelector("#registerPassword").value;
            const requestedRole = document.querySelector("#requestedRole").value;
            const submit = els.registerForm.querySelector("button[type='submit']");

            if (!firstName || !lastName) {
              setAuthMessage("Enter your first and last name.", "error");
              return;
            }

            submit.disabled = true;
            submit.textContent = "Creating Account…";
            accountProvisioning = true;

            try {
              const credential = await createUserWithEmailAndPassword(auth, email, password);
              const displayName = `${firstName} ${lastName}`;
              await updateProfile(credential.user, { displayName });

              const setupRef = doc(db, "system", "setup");
              const staffRef = doc(db, "users", credential.user.uid);
              const setupSnapshot = await getDoc(setupRef);

              if (!setupSnapshot.exists()) {
                const batch = writeBatch(db);
                batch.set(setupRef, {
                  initialized: true,
                  initializedBy: credential.user.uid,
                  initializedAt: serverTimestamp(),
                  facilityName: "Northstar Medical Center"
                });
                batch.set(staffRef, {
                  uid: credential.user.uid,
                  firstName,
                  lastName,
                  displayName,
                  email,
                  requestedRole,
                  role: "administrator",
                  status: "active",
                  createdAt: serverTimestamp(),
                  approvedAt: serverTimestamp(),
                  approvedBy: credential.user.uid
                });
                await batch.commit();
                showToast("Northstar administrator account created.");
              } else {
                await setDoc(staffRef, {
                  uid: credential.user.uid,
                  firstName,
                  lastName,
                  displayName,
                  email,
                  requestedRole,
                  role: "staff",
                  status: "pending",
                  createdAt: serverTimestamp()
                });
              }

              accountProvisioning = false;
              await routeAuthenticatedUser(credential.user);
            } catch (error) {
              setAuthMessage(friendlyError(error), "error");
            } finally {
              accountProvisioning = false;
              submit.disabled = false;
              submit.textContent = "Create Staff Account";
            }
          }'''

          app, n = re.subn(
              r'async function registerStaff\(event\) \{.*?\n\}\n\nasync function signInStaff',
              new_register + '\n\nasync function signInStaff',
              app,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit('registerStaff patch failed')

          profile_fn = '''async function loadStaffProfile(user) {
            const snapshot = await getDoc(doc(db, "users", user.uid));
            return snapshot.exists() ? snapshot.data() : null;
          }'''

          helpers = '''

          function accountNameParts(user) {
            const displayName = normalizeName(user.displayName || "");
            if (displayName) {
              const parts = displayName.split(" ");
              return { firstName: parts.shift() || "Staff", lastName: parts.join(" ") || "Member", displayName };
            }
            const localPart = normalizeName((user.email || "staff").split("@")[0].replace(/[._-]+/g, " "));
            const parts = localPart.split(" ").filter(Boolean);
            const firstName = parts.shift() || "Staff";
            const lastName = parts.join(" ") || "Member";
            return { firstName, lastName, displayName: `${firstName} ${lastName}`.trim() };
          }

          async function ensureStaffProfile(user) {
            const existing = await loadStaffProfile(user);
            if (existing) return existing;

            const setupRef = doc(db, "system", "setup");
            const staffRef = doc(db, "users", user.uid);
            const setupSnapshot = await getDoc(setupRef);
            const names = accountNameParts(user);
            const email = (user.email || "").toLowerCase();

            if (!setupSnapshot.exists()) {
              const batch = writeBatch(db);
              batch.set(setupRef, {
                initialized: true,
                initializedBy: user.uid,
                initializedAt: serverTimestamp(),
                facilityName: "Northstar Medical Center"
              });
              batch.set(staffRef, {
                uid: user.uid,
                firstName: names.firstName,
                lastName: names.lastName,
                displayName: names.displayName,
                email,
                requestedRole: "physician",
                role: "administrator",
                status: "active",
                createdAt: serverTimestamp(),
                approvedAt: serverTimestamp(),
                approvedBy: user.uid
              });
              await batch.commit();
              return loadStaffProfile(user);
            }

            if (setupSnapshot.data()?.initializedBy === user.uid) {
              await setDoc(staffRef, {
                uid: user.uid,
                firstName: names.firstName,
                lastName: names.lastName,
                displayName: names.displayName,
                email,
                requestedRole: "physician",
                role: "administrator",
                status: "active",
                createdAt: serverTimestamp(),
                approvedAt: serverTimestamp(),
                approvedBy: user.uid
              });
              return loadStaffProfile(user);
            }

            await setDoc(staffRef, {
              uid: user.uid,
              firstName: names.firstName,
              lastName: names.lastName,
              displayName: names.displayName,
              email,
              requestedRole: "staff",
              role: "staff",
              status: "pending",
              createdAt: serverTimestamp()
            });
            return loadStaffProfile(user);
          }

          async function routeAuthenticatedUser(user) {
            setAuthMessage();
            if (!user) {
              currentStaff = null;
              stopClinicalListeners();
              showView(els.authView);
              switchAuth("signin");
              return;
            }

            try {
              const profile = await ensureStaffProfile(user);
              if (!profile) throw new Error("missing-profile");
              currentStaff = profile;

              if (profile.status !== "active") {
                stopClinicalListeners();
                showView(els.pendingView);
                return;
              }

              renderStaffIdentity(profile);
              showView(els.mainView);
              openSection("dashboard");
              startClinicalListeners();
            } catch (error) {
              currentStaff = null;
              stopClinicalListeners();
              showView(els.authView);
              setAuthMessage(friendlyError(error), "error");
            }
          }'''

          if 'async function ensureStaffProfile(user)' not in app:
              if profile_fn not in app:
                  raise SystemExit('loadStaffProfile marker missing')
              app = app.replace(profile_fn, profile_fn + helpers, 1)

          new_auth = '''onAuthStateChanged(auth, async (user) => {
            if (accountProvisioning) return;
            await routeAuthenticatedUser(user);
          });

          updateClock();'''
          app, n = re.subn(
              r'onAuthStateChanged\(auth, async \(user\) => \{.*?\n\}\);\n\nupdateClock\(\);',
              new_auth,
              app,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit('auth handler patch failed')
          p.write_text(app)

          rp = Path('firestore.rules')
          rules = rp.read_text()
          rules = rules.replace(
              "return role in ['physician', 'nurse', 'registration', 'technician'];",
              "return role in ['physician', 'nurse', 'registration', 'technician', 'staff'];"
          )

          users_start = rules.index('    match /users/{uid} {')
          create_start = rules.index('      allow create: if signedIn()', users_start)
          update_start = rules.index('      allow update:', create_start)
          new_create = '''      allow create: if signedIn()
                            && request.auth.uid == uid
                            && request.resource.data.uid == request.auth.uid
                            && request.resource.data.email == request.auth.token.email
                            && validRequestedRole(request.resource.data.requestedRole)
                            && (
                              (
                                !exists(/databases/$(database)/documents/system/setup)
                                && request.resource.data.role == 'administrator'
                                && request.resource.data.status == 'active'
                                && request.resource.data.approvedBy == request.auth.uid
                              )
                              ||
                              (
                                exists(/databases/$(database)/documents/system/setup)
                                && get(/databases/$(database)/documents/system/setup).data.initializedBy == request.auth.uid
                                && request.resource.data.role == 'administrator'
                                && request.resource.data.status == 'active'
                                && request.resource.data.approvedBy == request.auth.uid
                              )
                              ||
                              (
                                exists(/databases/$(database)/documents/system/setup)
                                && request.resource.data.role == 'staff'
                                && request.resource.data.status == 'pending'
                                && !('approvedBy' in request.resource.data)
                              )
                            );

          '''
          rules = rules[:create_start] + new_create + rules[update_start:]
          rp.write_text(rules)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add app.js firestore.rules
          git commit -m "Repair Northstar account provisioning"
          git push origin main
