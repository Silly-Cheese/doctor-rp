name: Optimize Core Clinical Rendering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.event.head_commit.message == 'Apply core clinical performance optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Optimize clinical rendering
        run: python scripts/optimize_core_clinical.py
      - name: Verify JavaScript syntax
        run: |
          node --check clinical.js
          node --check northstar-highrisk-med.js
          node --check northstar-order-ack.js
          node --check northstar-scenario-director.js
          node --check clinical-bridge.js
      - name: Commit optimized clinical module
        shell: bash
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add clinical.js
          git commit -m "Reduce hidden clinical rendering work"
          git push origin main
