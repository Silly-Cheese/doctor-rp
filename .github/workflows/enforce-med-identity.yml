name: Enforce Medication Identity Verification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enforce:
    if: github.event.head_commit.message == 'Run medication identity enforcement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply MAR verification guard
        run: python scripts/enforce_med_identity.py
      - name: Verify JavaScript syntax
        run: |
          node --check northstar-med-verification.js
          node --check northstar-clinical-plus.js
      - name: Commit MAR verification guard
        shell: bash
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add northstar-med-verification.js northstar-clinical-plus.js
          git commit -m "Require verified patient identity for medication administration"
          git push origin main
