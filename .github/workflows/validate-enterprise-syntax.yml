name: Validate Enterprise Syntax
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check enterprise JavaScript
        run: |
          node --check northstar-enterprise.js
          node --check clinical-bridge.js
          node --check case-records.js
