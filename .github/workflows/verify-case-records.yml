name: Verify Northstar Case Archive

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify confidential case archive'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check case-records.js
          node --check clinical-bridge.js
