name: Finalize Northstar Platform

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run final Northstar access fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply access fixes
        run: python scripts/finalize_platform.py
      - name: Verify JavaScript
        run: node --check northstar-simulation.js
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add northstar-simulation.js firestore.rules
          git commit -m "Tighten emergency permissions and record merge handling"
          git push origin main
