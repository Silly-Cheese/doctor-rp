name: Stabilize Deceased Vault Rendering

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stabilize:
    if: github.event.head_commit.message == 'Stabilize deceased vault rendering'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply render stabilization
        run: python scripts/fix_deceased_vault_render.py
      - name: Verify JavaScript
        run: node --check deceased-access.js
      - name: Commit stabilization
        shell: bash
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add deceased-access.js
          git commit -m "Prevent confidential record render loops"
          git push origin main
