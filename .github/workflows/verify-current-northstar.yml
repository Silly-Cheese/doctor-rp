name: Verify Current Northstar Integration
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.head_commit.message == 'Verify current Northstar integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check clinical.js
          node --check clinical-bridge.js
          node --check northstar-enterprise.js
          node --check northstar-breakglass.js
          node --check northstar-safety-banner.js
          node --check northstar-med-verification.js
          node --check northstar-legacy-med-guard.js
          node --check northstar-highrisk-med.js
          node --check northstar-order-ack.js
          node --check northstar-scenario-director.js
          node --check northstar-pwa.js
          node --check service-worker.js
