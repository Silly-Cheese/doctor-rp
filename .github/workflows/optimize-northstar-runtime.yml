name: Optimize Northstar Runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message == 'Run Northstar runtime optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply runtime optimizations
        run: python scripts/optimize_northstar_runtime.py
      - name: Verify JavaScript syntax
        run: |
          node --check northstar-clinical-plus.js
          node --check northstar-platform.js
          node --check admin-controls.js
          node --check deceased-access.js
          node --check northstar-med-verification.js
          node --check clinical-bridge.js
      - name: Commit optimized runtime
        shell: bash
        run: |
          git config user.name "Northstar Medical Center"
          git config user.email "northstar@users.noreply.github.com"
          git add northstar-clinical-plus.js northstar-platform.js admin-controls.js deceased-access.js
          git commit -m "Improve Northstar rendering performance and chart stability"
          git push origin main
