name: Verify Northstar Platform

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify Northstar platform expansion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify JavaScript syntax
        run: |
          node --check northstar-platform.js
          node --check northstar-clinical-plus.js
          node --check northstar-simulation.js
          node --check clinical-bridge.js
          node --check case-records.js
          node --check clinical.js
          node --check app.js
